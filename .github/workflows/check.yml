name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
